name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -v

      - name: Build package
        run: python -m build

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: retail-insight-platform-${{ github.sha }}
          path: dist/*
          retention-days: 14
